name: Build and Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main  # đổi nếu branch chính của bạn không phải main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Export static HTML (next export)
        run: npx next export -o out

      - name: Upload Pages artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./out
